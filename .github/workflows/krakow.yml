name: Build Krakow APK
on:
  push:
    paths: [KrakowTrip.zip, .github/workflows/krakow.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o KrakowTrip.zip
      - name: Fetch fonts from Google Fonts
        working-directory: KrakowTrip
        run: |
          mkdir -p app/src/main/res/font
          get() {
            url=$(curl -fsSL "https://fonts.googleapis.com/css2?family=$1" | grep -o "https://[^)]*" | head -1) || return 0
            out="app/src/main/res/font/$2.ttf"
            curl -fsSL "$url" -o "$out" || { rm -f "$out"; return 0; }
            magic=$(head -c4 "$out" | od -An -tx1 | tr -d ' \n')
            case "$magic" in 00010000|74727565|4f54544f) echo "$2 ok";; *) echo "$2 not a TTF ($magic), skipped"; rm -f "$out";; esac
          }
          get "Fraunces:wght@600" fraunces_600
          get "Work+Sans:wght@400" worksans_400
          get "Work+Sans:wght@500" worksans_500
          get "Work+Sans:wght@600" worksans_600
          ls -la app/src/main/res/font
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --stacktrace
        working-directory: KrakowTrip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: krakow-build-1
          name: Krakow Trip (latest)
          files: KrakowTrip/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
