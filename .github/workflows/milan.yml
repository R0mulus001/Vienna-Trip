name: Build Milan APK
on:
  push:
    paths: [MilanTrip.zip, .github/workflows/milan.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o MilanTrip.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build signed release APK
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../MilanTrip.apk
        working-directory: MilanTrip
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - name: Remove the old debug APK from the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete-asset milan-build-1 app-debug.apk -y || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: milan-build-1
          name: Milan Trip (latest)
          files: MilanTrip.apk
          overwrite_files: true
          make_latest: false
