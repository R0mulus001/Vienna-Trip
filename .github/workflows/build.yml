name: Build APK
on:
  push:
    paths: [ViennaTrip.zip, .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ViennaTrip.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build signed release APK
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../ViennaTrip.apk
        working-directory: ViennaTrip
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - name: Remove the old debug APK from the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete-asset build-4 app-debug.apk -y || true
      - name: Upload APK to the "Vienna Trip (latest)" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view build-4 >/dev/null 2>&1 || gh release create build-4 --title "Vienna Trip (latest)" --notes "Latest Vienna Trip APK"
          gh release upload build-4 ViennaTrip.apk --clobber
