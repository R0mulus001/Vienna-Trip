name: Build APK
on:
  push:
    paths: [ViennaTrip.zip, .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ViennaTrip.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --stacktrace
        working-directory: ViennaTrip
      - name: Upload APK to the "Vienna Trip (latest)" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view build-4 >/dev/null 2>&1 || gh release create build-4 --title "Vienna Trip (latest)" --notes "Latest Vienna Trip APK"
          gh release upload build-4 ViennaTrip/app/build/outputs/apk/debug/app-debug.apk --clobber
