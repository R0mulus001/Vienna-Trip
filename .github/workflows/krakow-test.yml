name: Test Krakow app on emulator
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Get latest Krakow APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download krakow-build-1 -p app-debug.apk -O app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/emu/krakow-test.sh
      - name: Save screenshots to the emu-shots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots && git init -q && git checkout -q -b emu-shots && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "shots ${{ github.run_id }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" emu-shots
